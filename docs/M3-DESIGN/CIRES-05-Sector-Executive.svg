<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect id="background" x="0" y="0" width="390" height="844" rx="5" fill="#ffffff" stroke="none" /><text font-family="Arial" font-size="21" font-weight="700" id="brand" x="24" y="46" fill="#242424">CIRES</text><text font-family="Arial" font-size="26" font-weight="700" id="title" x="24" y="94" fill="#242424">Sector Executive</text><text font-family="Arial" font-size="15" font-weight="400" id="subtitle" x="24" y="124" fill="#242424">Review an overdue issue from a cell.</text><rect id="escalation-banner" x="24" y="152" width="342" height="72" rx="5" fill="#f5f5f5" stroke="#777777" /><text font-family="Arial" font-size="15" font-weight="700" id="escalation-title" x="40" y="181" fill="#242424">Escalated · follow-up deadline passed</text><text font-family="Arial" font-size="14" font-weight="400" id="escalation-help" x="40" y="207" fill="#242424">This open issue requires sector follow-up.</text><rect id="issue-panel" x="24" y="246" width="342" height="142" rx="5" fill="#f5f5f5" stroke="#777777" /><text font-family="Arial" font-size="23" font-weight="700" id="ref" x="40" y="278" fill="#242424">CIRES-001</text><text font-family="Arial" font-size="15" font-weight="400" id="issue" x="40" y="310" fill="#242424">Blocked drain near the local market.</text><text font-family="Arial" font-size="15" font-weight="700" id="status" x="40" y="340" fill="#242424">Work status · Received</text><text font-family="Arial" font-size="15" font-weight="400" id="reason" x="40" y="369" fill="#242424">Cell follow-up is overdue.</text><text font-family="Arial" font-size="16" font-weight="700" id="action-heading" x="24" y="429" fill="#242424">Action taken</text><rect id="action-note" x="24" y="447" width="342" height="103" rx="5" fill="#f5f5f5" stroke="#777777" /><text font-family="Arial" font-size="15" font-weight="400" id="action1" x="40" y="479" fill="#242424">The drain has been cleared.</text><text font-family="Arial" font-size="15" font-weight="400" id="action2" x="40" y="506" fill="#242424">Water is flowing normally.</text><text font-family="Arial" font-size="15" font-weight="400" id="action3" x="40" y="532" fill="#242424">Sector follow-up completed.</text><text font-family="Arial" font-size="15" font-weight="400" id="help1" x="24" y="592" fill="#242424">The citizen will see the completion note</text><text font-family="Arial" font-size="15" font-weight="400" id="help2" x="24" y="616" fill="#242424">when you resolve this issue.</text><rect id="resolve-button" x="24" y="674" width="342" height="48" rx="5" fill="#333333" stroke="#777777" /><text font-family="Arial" font-size="16" font-weight="700" id="resolve-button-label" x="195" y="704" fill="#ffffff" text-anchor="middle">Resolve escalated issue</text><rect id="back-button" x="24" y="746" width="342" height="48" rx="5" fill="#ffffff" stroke="#777777" /><text font-family="Arial" font-size="16" font-weight="700" id="back-button-label" x="195" y="776" fill="#242424" text-anchor="middle">Back to escalated issue</text></svg>