<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect id="background" x="0" y="0" width="390" height="844" rx="5" fill="#ffffff" stroke="none" /><text font-family="Arial" font-size="21" font-weight="700" id="brand" x="24" y="46" fill="#242424">CIRES</text><text font-family="Arial" font-size="26" font-weight="700" id="title" x="24" y="94" fill="#242424">Cell Executive</text><text font-family="Arial" font-size="15" font-weight="400" id="subtitle" x="24" y="124" fill="#242424">Review and update a reported issue.</text><rect id="issue-panel" x="24" y="154" width="342" height="163" rx="5" fill="#f5f5f5" stroke="#777777" /><text font-family="Arial" font-size="23" font-weight="700" id="ref" x="40" y="184" fill="#242424">CIRES-001</text><text font-family="Arial" font-size="15" font-weight="400" id="category" x="40" y="216" fill="#242424">Drainage · reported by a citizen</text><text font-family="Arial" font-size="15" font-weight="400" id="location" x="40" y="246" fill="#242424">Location · near the local market</text><text font-family="Arial" font-size="15" font-weight="400" id="issue" x="40" y="280" fill="#242424">Blocked drain causing water to collect.</text><text font-family="Arial" font-size="16" font-weight="700" id="status-label" x="24" y="353" fill="#242424">Update status</text><rect id="progress-option" x="24" y="369" width="342" height="48" rx="5" fill="#f5f5f5" stroke="#777777" /><text font-family="Arial" font-size="16" font-weight="700" id="progress-text" x="40" y="399" fill="#242424">In progress</text><text font-family="Arial" font-size="15" font-weight="400" id="progress-help" x="24" y="443" fill="#242424">Work has started on this issue.</text><text font-family="Arial" font-size="16" font-weight="700" id="note-label" x="24" y="485" fill="#242424">Completion note</text><rect id="completion-note" x="24" y="500" width="342" height="82" rx="5" fill="#f5f5f5" stroke="#777777" /><text font-family="Arial" font-size="15" font-weight="400" id="note1" x="40" y="531" fill="#242424">The drain has been cleared.</text><text font-family="Arial" font-size="15" font-weight="400" id="note2" x="40" y="556" fill="#242424">Water is flowing normally.</text><text font-family="Arial" font-size="15" font-weight="400" id="help1" x="24" y="612" fill="#242424">Resolve the issue after completing the work.</text><rect id="resolve-button" x="24" y="711" width="342" height="48" rx="5" fill="#333333" stroke="#777777" /><text font-family="Arial" font-size="16" font-weight="700" id="resolve-button-label" x="195" y="741" fill="#ffffff" text-anchor="middle">Resolve issue</text><rect id="back-button" x="24" y="777" width="342" height="48" rx="5" fill="#ffffff" stroke="#777777" /><text font-family="Arial" font-size="16" font-weight="700" id="back-button-label" x="195" y="807" fill="#242424" text-anchor="middle">Back to report</text></svg>