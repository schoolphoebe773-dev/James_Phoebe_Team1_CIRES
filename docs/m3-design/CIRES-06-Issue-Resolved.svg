<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect id="background" x="0" y="0" width="390" height="844" rx="5" fill="#ffffff" stroke="none" /><text font-family="Arial" font-size="21" font-weight="700" id="brand" x="24" y="46" fill="#242424">CIRES</text><text font-family="Arial" font-size="26" font-weight="700" id="title" x="24" y="94" fill="#242424">Issue resolved</text><text font-family="Arial" font-size="15" font-weight="400" id="subtitle" x="24" y="124" fill="#242424">Read the final reply for your report.</text><rect id="reference-panel" x="24" y="155" width="342" height="108" rx="5" fill="#f5f5f5" stroke="#777777" /><text font-family="Arial" font-size="24" font-weight="700" id="ref" x="40" y="190" fill="#242424">CIRES-001</text><text font-family="Arial" font-size="16" font-weight="700" id="status" x="40" y="232" fill="#242424">Current status · Resolved</text><text font-family="Arial" font-size="20" font-weight="700" id="history-heading" x="24" y="305" fill="#242424">Progress history</text><circle cx="34" cy="345" r="6" fill="#333333" /><text font-family="Arial" font-size="17" font-weight="700" id="received" x="54" y="350" fill="#242424">Received</text><text font-family="Arial" font-size="15" font-weight="400" id="received-detail" x="24" y="380" fill="#242424">Your cell office received the report.</text><circle cx="34" cy="433" r="6" fill="#333333" /><text font-family="Arial" font-size="17" font-weight="700" id="closed" x="54" y="438" fill="#242424">Resolved</text><text font-family="Arial" font-size="15" font-weight="400" id="closed-detail" x="24" y="468" fill="#242424">The work is complete. Read the reply below.</text><text font-family="Arial" font-size="18" font-weight="700" id="note-heading" x="24" y="527" fill="#242424">Final reply</text><rect id="final-note" x="24" y="544" width="342" height="101" rx="5" fill="#f5f5f5" stroke="#777777" /><text font-family="Arial" font-size="16" font-weight="400" id="note1" x="40" y="